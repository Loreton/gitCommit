main:
    # prepariamo i percorsi importanti
    pyLnLib_dir: "$ln_PY_LNLIB_DIR"
    ln_repo_dir: "$ln_GIT_REPO_DIR"

    git_default_flags: &flags
        description: null
        changelog: False
        tag:       False
        minor:     False
        major:     False
        patch:     False
        version:  "0.0.0"
        commit:  False
        push:  False
        pylnlib_commit_nr:  None
        # fNewVersion: False

git_project:
    gitCommit:
        name: gitCommit
        path: "${HOME}/filu/Programming/gitREPO/gitCommit"
        <<: *flags
        cmd_list: []
        python: True

    deviceManager:
        name: deviceManager
        path: "${HOME}/filu/Programming/gitREPO/lnDevices/deviceManager"
        <<: *flags
        cmd_list: []
        python: True

    lnEsptool:
        name: lnEsptool
        path: "${HOME}/filu/Programming/gitREPO/lnEsptool"
        <<: *flags
        cmd_list: []
        python: False

    lnSync:
        name: lnSync
        path: "${HOME}/filu/Programming/gitREPO/lnSync"
        <<: *flags
        cmd_list: []
        python: True

    pressControl:
        name: pressControl
        path: "${HOME}/filu/Programming/gitREPO/esp32/pressControl"
        <<: *flags
        cmd_list: []
        python: False

    orto_esp32:
        name: orto_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/orto_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnTimeSched_esp32:
        name: lnTimeSched_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTimeSched_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnLogger_esp32:
        name: lnLogger_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnLogger_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnTimeClock_esp32:
        name: lnTimeClock_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTimeClock_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnTelegram_esp32:
        name: lnTelegram_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTelegram_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnWifiManager_esp32:
        name: lnWifiManager_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnWifiManager_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnTelegramSendHttp_esp32:
        name: lnTelegramSendHttp_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTelegramSendHttp_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnSerialRead_esp32:
        name: lnSerialRead_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnSerialRead_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnMillisTimers_esp32:
        name: lnMillisTimers_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnMillisTimers_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnButtonManager_esp32:
        name: lnButtonManager_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnButtonManager_esp32"
        <<: *flags
        cmd_list: []
        python: False

    lnCheckPins_esp32:
        name: lnCheckPins_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnCheckPins_esp32"
        <<: *flags
        cmd_list: []
        python: False

    pyLnLib:
        name: pyLnLib
        path: "${HOME}/filu/Programming/gitREPO/pyLnLib"
        <<: *flags
        cmd_list: []
        python: True



