    lntelegramsendhttp_esp32:
        name: lnTelegramSendHttp_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTelegramSendHttp_esp32"
        <<: *no_py_flags
        cmd_list: []
        is_python: False

    lnserialread_esp32:
        name: lnSerialRead_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnSerialRead_esp32"
        <<: *no_py_flags

    lnmillistimers_esp32:
        name: lnMillisTimers_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnMillisTimers_esp32"
