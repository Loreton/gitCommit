        <<: *no_py_flags


    lntelegram_esp32:
        name: lnTelegram_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTelegram_esp32"
        <<: *no_py_flags


    lnwifimanager_esp32:
        name: lnWifiManager_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnWifiManager_esp32"
