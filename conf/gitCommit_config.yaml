main:
    # prepariamo i percorsi importanti
    pyLnLib_dir: "$ln_PY_LNLIB_DIR"
    ln_repo_dir: "$ln_GIT_REPO_DIR"



    git_default_flags: &flags
        set_tag:       False
        last_tag:       null
        minor:     null
        major:     null
        patch:     null
        curr_version:  "0.0.0"
        commit:  False
        push:  False

    python_flags: &py_flags
        <<: *flags
        pylnlib_required: True
        is_python: True

    no_python_flags: &no_py_flags
        <<: *flags
        pylnlib_required: False
        is_python: False



input_args:

git_project:

    pylnlib:
        name: pyLnLib
        path: "${HOME}/filu/Programming/gitREPO/pyLnLib"
        <<: *py_flags
        pylnlib_required: False

    buildpythonproject:
        name: buildPythonProject
        path: "${HOME}/filu/Programming/gitREPO/buildPythonProject"
        <<: *py_flags


    gitcommit:
        name: gitCommit
        path: "${HOME}/filu/Programming/gitREPO/gitCommit"
        <<: *py_flags


    ebooks:
        name: eBooks
        path: "${HOME}/filu/Programming/gitREPO/eBooks"
        <<: *py_flags


    devicemanager:
        name: deviceManager
        path: "${HOME}/filu/Programming/gitREPO/lnDevices/deviceManager"
        <<: *py_flags


    lnsync:
        name: lnSync
        path: "${HOME}/filu/Programming/gitREPO/lnSync"
        <<: *py_flags


    lnesptool:
        name: lnEsptool
        path: "${HOME}/filu/Programming/gitREPO/lnEsptool"
        <<: *py_flags


    presscontrol:
        name: pressControl
        path: "${HOME}/filu/Programming/gitREPO/esp32/pressControl"
        <<: *py_flags


    orto_esp32:
        name: orto_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/orto_esp32"
        <<: *no_py_flags


    lntimesched_esp32:
        name: lnTimeSched_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnTimeSched_esp32"
        <<: *no_py_flags


    lnlogger_esp32:
        name: lnLogger_esp32
        path: "${HOME}/filu/Programming/gitREPO/esp32/lnLibraries/lnLogger_esp32"
        <<: *no_py_flags


    lntimeclock_esp32:
        name: lnTimeClock_esp32
