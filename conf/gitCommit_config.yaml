main:
    # prepariamo i percorsi importanti
    pyLnLib_dir: "$ln_PY_LNLIB_DIR"
    ln_repo_dir: "$ln_GIT_REPO_DIR"

    git_default_flags: &flags
        # main_dir_name: "no_name"
        # just_commit: False
        # name: "no_name"
        # description: null
        set_tag:       False
        last_tag:       null
        minor:     null
        major:     null
        patch:     null
        # new_version:  "0.0.0"
        curr_version:  "0.0.0"
        commit:  False
        push:  False
        # pylnlib_commit_nr:  null
        # pylnlib_full_update: False

